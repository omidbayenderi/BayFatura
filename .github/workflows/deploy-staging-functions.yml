name: Deploy Staging Functions (Manual)

on:
  workflow_dispatch:

concurrency:
  group: staging-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-staging-functions:
    name: Validate & Deploy Staging Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate app
        run: |
          npm run lint
          npm test
          npm run build

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Validate functions syntax
        run: node --check functions/index.js

      - name: Prepare staging Firebase credentials
        run: |
          printf '%s' "$STAGING_FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/staging-service-account.json"
        env:
          STAGING_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}

      - name: Prepare staging functions environment
        run: |
          {
            printf 'RESEND_API_KEY=%s\n' "$STAGING_RESEND_API_KEY"
            printf 'STRIPE_SECRET_KEY=%s\n' "$STAGING_STRIPE_SECRET_KEY"
            printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STAGING_STRIPE_WEBHOOK_SECRET"
            printf 'APP_URL=%s\n' "$STAGING_APP_URL"
          } > functions/.env
        env:
          STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
          STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}

      - name: Deploy functions to staging
        run: npx -y firebase-tools@latest deploy --only functions --project "$STAGING_FIREBASE_PROJECT_ID"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/staging-service-account.json
          STAGING_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_VITE_FIREBASE_PROJECT_ID }}
